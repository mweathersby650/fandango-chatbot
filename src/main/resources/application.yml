spring:
  application:
    name: chatbot
  autoconfigure:
    exclude:
      - org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        model: claude-haiku-4-5-20251001
        max-tokens: 1024

server:
  port: 8080

logging:
  level:
    com.fandango: DEBUG
